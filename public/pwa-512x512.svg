<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <g transform="translate(128, 140) scale(2.6)" filter="url(#shadow)">
    <!-- Box Bottom -->
    <path d="M10 30 L90 30 L85 80 L15 80 Z" fill="url(#boxGrad)" />
    <!-- Box Lid -->
    <rect x="0" y="10" width="100" height="20" rx="4" fill="url(#boxGrad)" />
    
    <!-- Vertical Ribbon -->
    <rect x="40" y="10" width="20" height="70" fill="url(#ribbonGrad)" />
    <!-- Horizontal Ribbon -->
    <rect x="0" y="20" width="100" height="10" fill="url(#ribbonGrad)" />
    
    <!-- Bow -->
    <path d="M50 15 C40 -5 10 -5 35 15 Z" fill="url(#ribbonGrad)" />
    <path d="M50 15 C60 -5 90 -5 65 15 Z" fill="url(#ribbonGrad)" />
  </g>
  
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" font-style="italic" fill="white" text-anchor="middle" letter-spacing="2">CREATIVOS</text>
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="4">GIFT</text>
</svg>
